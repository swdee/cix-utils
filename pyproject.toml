[project]
name = "cix_utils"
version = "0.1.0"
description = "CIX NOE Engine inference"
readme = "README.md"
requires-python = ">=3.8"
license = { text = "Apache-2.0" }
authors = [
  { name = "swdee" }
]
dependencies = [
  "numpy>=1.26"
]
classifiers = [
  "Programming Language :: Python :: 3",
  "License :: OSI Approved :: Apache Software License",
]
urls = { "Homepage" = "https://github.com/swdee/cix-utils" }


[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
